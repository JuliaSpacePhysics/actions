name: Benchmark

# Caller triggers on `pull_request` and `push` to the default branch, names its job `benchmark`,
# and grants `permissions: {actions: write, contents: read}`; each job narrows these.
# PR code runs here without write access; benchmark-comment.yml posts the results.
on:
  workflow_call:

# Same pkgimage-cache reason as julia-ci.yml.
env:
  JULIA_CPU_TARGET: haswell

jobs:
  benchmark:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The action runs the default branch's script on both revisions; until that branch
      # has one (the PR adding benchmarks), benchmark the PR head alone on its own script.
      - id: revs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/benchmark/benchmarks.jl?ref=$BASE" --silent 2>/dev/null; then
            echo "rev=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          job-summary: 'true' # writes body.md instead of commenting
          rev: ${{ steps.revs.outputs.rev }}
          bench-on: ${{ steps.revs.outputs.rev }}
      - env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir "$RUNNER_TEMP/benchmark-comment"
          cp body.md "$RUNNER_TEMP/benchmark-comment/"
          echo "$PR" > "$RUNNER_TEMP/benchmark-comment/pr"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-comment # read by benchmark-comment.yml
          path: ${{ runner.temp }}/benchmark-comment
          retention-days: 7

  # PR runs save caches only to their own PR's scope, so the cache that `benchmark`
  # restores must be saved from the default branch.
  seed-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write # julia-actions/cache deletes its old caches
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      # The key must match the one the AirspeedVelocity action restores in `benchmark`.
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=benchmark
      - env:
          URL: ${{ github.event.repository.clone_url }}
          REV: ${{ github.event.repository.default_branch }}
        run: |
          export JULIA_NUM_THREADS=2
          julia -e 'ENV["JULIA_PKG_PRECOMPILE_AUTO"]=0; using Pkg; Pkg.add(PackageSpec(name="AirspeedVelocity", version="0.6"))'
          julia -e 'ENV["JULIA_PKG_PRECOMPILE_AUTO"]=0; using Pkg; Pkg.build("AirspeedVelocity")'
          pkg=$(awk -F' *= *' '/^name *=/ {gsub(/"/,"",$2); print $2; exit}' Project.toml)
          ~/.julia/bin/benchpkg "$pkg" --url="$URL" --rev="$REV" --output-dir="$(mktemp -d)"
