name: Doc Preview Cleanup

# Caller triggers on `pull_request: types: [closed]` and grants `permissions: {contents: write}`.
on:
  workflow_call:

# Shared group: concurrent force-pushes to gh-pages would drop each other's deletions.
concurrency:
  group: doc-preview-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  doc-preview-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Delete preview, squash history, force-push
        env:
          preview_dir: previews/PR${{ github.event.number }}
        run: |
          if [ -d "${preview_dir}" ]; then
              git config user.name "Documenter.jl"
              git config user.email "documenter@juliadocs.github.io"
              git rm -rf "${preview_dir}"
              git commit -m "delete preview"
              git branch gh-pages-new "$(echo "delete history" | git commit-tree "HEAD^{tree}")"
              git push --force origin gh-pages-new:gh-pages
          fi
