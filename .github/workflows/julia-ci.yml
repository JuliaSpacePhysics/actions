name: Julia CI

# Caller needs `permissions: {actions: write, contents: read}` (julia-actions/cache deletes its old caches)
# and `secrets: inherit` (CODECOV_TOKEN).
on:
  workflow_call:
    inputs:
      versions:
        description: 'JSON array of Julia versions; "pre" is allowed to fail'
        type: string
        default: '["1"]'
      os:
        description: 'JSON array of runner images'
        type: string
        default: '["ubuntu-latest"]'
      setup:
        description: 'Bash command run after checkout, before building the package'
        type: string
        default: ''

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
        os: ${{ fromJSON(inputs.os) }}
    steps:
      # Pkgimages default to the host CPU, and ubuntu-latest runners have mixed CPUs;
      # a fixed target keeps the restored cache loadable. x64-only target.
      - if: runner.arch == 'X64'
        shell: bash
        run: echo "JULIA_CPU_TARGET=x86-64-v3" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
