name: Julia CI

# Caller needs `permissions: {actions: write, contents: read}` (julia-actions/cache deletes its old caches)
# and `secrets: inherit` (CODECOV_TOKEN).
on:
  workflow_call:
    inputs:
      versions:
        description: 'JSON array of Julia versions that must pass'
        type: string
        default: '["1"]'
      pre:
        description: 'Also test the Julia prerelease, allowed to fail'
        type: boolean
        default: false
      setup:
        description: 'Shell command run before building the package, e.g. installing a system library'
        type: string
        default: ''

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
        allow_failure: [false]
        include: ${{ fromJSON(inputs.pre && '[{"version":"pre","allow_failure":true}]' || '[]') }}
    steps:
      # Pkgimages default to the host CPU, and ubuntu-latest runners have mixed CPUs;
      # a fixed target keeps the restored cache loadable. x64-only target.
      - if: runner.arch == 'X64'
        run: echo "JULIA_CPU_TARGET=x86-64-v3" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
