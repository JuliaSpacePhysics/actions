name: Julia CI

# Caller needs `permissions: {actions: write, contents: read}` (julia-actions/cache deletes its old caches)
# and `secrets: inherit` (CODECOV_TOKEN).
on:
  workflow_call:
    inputs:
      versions:
        description: 'JSON array of Julia versions; "pre" is allowed to fail, and is dropped while no prerelease is newer than the latest stable'
        type: string
        default: '["1"]'
      os:
        description: 'JSON array of runner images'
        type: string
        default: '["ubuntu-latest"]'
      env:
        description: 'KEY=VALUE lines exported to the build and test steps; overrides the default JULIA_NUM_THREADS=auto'
        type: string
        default: ''
      setup:
        description: 'Bash command run after checkout, before building the package'
        type: string
        default: ''

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      # Between release cycles "pre" resolves to the same Julia as "1"; drop it then.
      # Fails open: any error in fetching or parsing keeps the input unchanged.
      - id: resolve
        shell: bash
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          out=$(jq -c . <<<"$VERSIONS")
          if jq -e 'index("pre")' <<<"$out" >/dev/null &&
            redundant=$(curl -fsSL --retry 3 https://julialang-s3.julialang.org/bin/versions.json | jq '
              def base: split("-")[0] | split(".") | map(tonumber);
              to_entries
              | ([.[] | select(.value.stable) | .key | base] | max) as $stable
              | all(.[] | select(.value.stable | not) | .key | base; . <= $stable)') &&
            [ "$redundant" = true ]; then
            out=$(jq -c 'map(select(. != "pre")) as $r | if $r == [] then . else $r end' <<<"$out")
          fi
          echo "versions=$out" >> "$GITHUB_OUTPUT"

  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    needs: versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
        os: ${{ fromJSON(inputs.os) }}
    steps:
      # Pkgimages default to the host CPU, and ubuntu-latest runners have mixed CPUs;
      # a fixed target keeps the restored cache loadable. x64-only target.
      - if: runner.arch == 'X64'
        shell: bash
        run: echo "JULIA_CPU_TARGET=x86-64-v3" >> "$GITHUB_ENV"
      - shell: bash
        env:
          VARS: ${{ inputs.env }}
        run: |
          echo "JULIA_NUM_THREADS=auto" >> "$GITHUB_ENV"
          [ -n "$VARS" ] && echo "$VARS" >> "$GITHUB_ENV" || true
      - uses: actions/checkout@v7
      - if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
